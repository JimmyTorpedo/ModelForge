<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelForge — Custom AI Model Platform</title>
  <meta name="description" content="ModelForge lets you build, train, and deploy your own custom AI model in minutes. No technical expertise required." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="light-theme">

    if (localStorage.getItem('lightThemeActive') === 'false') {
      document.body.classList.remove('light-theme');
    }

  <!-- Load view templates first, then app logic -->
  <script src="views.js"></script>
  <script src="app.js"></script>
